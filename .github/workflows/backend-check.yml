name: Backend check

on:
  workflow_dispatch:

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_go
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Download modules
        run: go mod tidy

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
